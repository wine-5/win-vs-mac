<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>InGame HUD — DxLib 実装想定プロトタイプ</title>
<style>
/* =========================================================
 * DxLib で実際に描ける表現だけで組んだ InGame HUD。
 *
 * 制約（IUIRenderer に合わせる）:
 *   - 使えるのは drawBox / drawCircle / drawTriangle / drawText / drawImage のみ
 *   - drawImage は拡大縮小のみ。回転なし・9スライスなし
 *   - グラデーションは無い → 単色矩形の積み重ねで擬似的に作る
 *   - 角丸は無い → 直角、または drawTriangle による角落とし
 *   - ぼかし(backdrop-filter)は無い → 半透明の単色塗りで代替
 *
 * 全ての座標・サイズは 1920x1080 基準の実ピクセル。
 * ======================================================= */

  :root{
    --blue:#00A4EF; --cyan:#22D3EE; --yellow:#FFC83D; --crit:#E81123;
    --ink:#EAF1FB; --ink-dim:#9DB0C7; --ink-faint:#5E708A;
    --panel:rgba(14,20,32,.72);
    --border:rgba(140,170,210,.18);
    --border-bright:rgba(140,190,255,.40);
    /* 実装で使うフォントと同じものを指定する。
       Cascadia Mono に日本語グリフは無いため、日本語は Noto Sans JP へ落ちる。
       実装側では setFont で明示的に切り替える */
    --mono:"Cascadia Mono","Noto Sans JP",Consolas,monospace;
    --ui:"Noto Sans JP","Segoe UI",sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; overflow:hidden; background:#05070C; }
  body{ font-family:var(--ui); color:var(--ink); display:grid; place-items:center; }

  /* 1920x1080 の実寸ステージ。ビューポートに合わせて等倍縮小するだけなので、
     ここに書いた px はそのまま実装時の px になる */
  #stage{ position:relative; width:1920px; height:1080px; overflow:hidden;
          transform-origin:center center; flex:none; }

  /* ---- 背景（3D画面の代役。HUDの可読性確認用のダミー） ---- */
  #bg{ position:absolute; inset:0;
       background:
         radial-gradient(circle at 50% 42%, rgba(0,164,239,.18), transparent 58%),
         repeating-linear-gradient(0deg, rgba(0,164,239,.05) 0 1px, transparent 1px 72px),
         repeating-linear-gradient(90deg, rgba(0,164,239,.05) 0 1px, transparent 1px 72px),
         linear-gradient(180deg,#04070E 0%,#070C15 55%,#0A1018 100%); }
  #bg .floorline{ position:absolute; left:0; right:0; top:62%; height:1px; background:rgba(0,164,239,.25); }

  /* =========================================================
   * パネル
   *   .p-box  … drawBox 2回（塗り＋枠）だけで描く版。画像ゼロ
   *   .p-img  … 背景画像を1枚貼る版（上端ハイライト・角落とし込み）
   * body.imgpanel で切り替える
   * ======================================================= */
  .panel{ position:absolute; }
  .panel .fill{ position:absolute; inset:0; background:var(--panel); }
  .panel .frame{ position:absolute; inset:0; border:1px solid var(--border); }
  /* 画像パネル想定：上端1pxのハイライトと、左上/右下の角落としを焼き込んだ絵 */
  body.imgpanel .panel .fill{
    background:
      linear-gradient(180deg, rgba(255,255,255,.075) 0 1px, rgba(255,255,255,.02) 1px 2px, transparent 2px),
      linear-gradient(180deg, rgba(20,28,44,.80), rgba(10,15,25,.74));
  }
  body.imgpanel .panel .frame{ border-color:var(--border-bright); }
  body.imgpanel .panel .corner{ display:block; }
  /* 角落とし（画像版のみ。実装では画像に焼き込む） */
  .panel .corner{ display:none; position:absolute; width:9px; height:9px; }
  .panel .corner.tl{ left:-1px; top:-1px;
    background:linear-gradient(135deg, #05070C 0 50%, transparent 50%); }
  .panel .corner.br{ right:-1px; bottom:-1px;
    background:linear-gradient(315deg, #05070C 0 50%, transparent 50%); }

  /* =========================================================
   * バー：drawBox の積み重ねで作る
   *   溝1枚 ＋ 塗りを縦3段に分けて擬似グラデ ＋ 上端ハイライト1px
   *   角丸なし・端は直角（DxLib で崩れない形）
   * ======================================================= */
  .bar{ position:absolute; }
  .bar .groove{ position:absolute; inset:0; background:rgba(255,255,255,.05); }
  .bar .grooveFrame{ position:absolute; inset:0; border:1px solid rgba(255,255,255,.06); }
  .bar .fillwrap{ position:absolute; left:1px; top:1px; bottom:1px; overflow:hidden; }
  .bar .band{ position:absolute; left:0; right:0; }
  .bar .tickline{ position:absolute; top:0; bottom:0; width:1px; background:rgba(0,0,0,.35); }

  /* =========================================================
   * ① プレイヤーHP（左下） 270x92 @ (22, 966)
   * ======================================================= */
  #php{ left:22px; top:966px; width:270px; height:92px; }
  #php .name{ position:absolute; left:14px; top:11px; font-size:13px; font-weight:600; letter-spacing:.02em; }
  #php .num{ position:absolute; right:14px; top:12px; font-family:var(--mono); font-size:12px; color:var(--ink-dim); }
  #php .bar{ left:14px; top:34px; width:242px; height:12px; }
  #php .chip{ position:absolute; top:56px; height:18px; font-family:var(--mono); font-size:10px;
              line-height:18px; padding:0 7px; }
  #php .chip .cf{ position:absolute; inset:0; }
  #php .chip span{ position:relative; }
  #php .chip.a{ left:14px; }
  #php .chip.b{ left:96px; }
  #php .chip.a .cf{ background:rgba(0,164,239,.12); border:1px solid rgba(0,164,239,.25); }
  #php .chip.b .cf{ background:rgba(94,112,138,.10); border:1px solid rgba(94,112,138,.30); }
  #php .chip.a{ color:var(--blue); }
  #php .chip.b{ color:var(--ink-faint); }

  /* =========================================================
   * ③ 目標＋現在地（左上） 230x118 @ (22, 18)
   * ======================================================= */
  #obj{ left:22px; top:18px; width:230px; height:118px; }
  #obj .cap{ position:absolute; left:13px; top:11px; right:13px; font-size:10px; letter-spacing:.16em;
             color:var(--ink-dim); font-weight:600; display:flex; justify-content:space-between; }
  #obj .count{ position:absolute; left:13px; top:28px; font-family:var(--mono); font-size:26px;
               font-weight:700; line-height:1; }
  #obj .goaltxt{ position:absolute; left:56px; top:28px; font-size:13px; line-height:1.35; color:var(--ink-dim); }
  #obj .goaltxt b{ color:var(--ink); font-weight:600; }
  #obj .sep{ position:absolute; left:13px; right:13px; top:74px; height:1px; background:var(--border); }
  #obj .prefix{ position:absolute; left:13px; top:80px; font-size:9px; letter-spacing:.14em; color:var(--ink-faint); }
  #obj .path{ position:absolute; left:13px; top:92px; font-family:var(--mono); font-size:12px; color:#E8F2FC; }
  #obj .depth{ position:absolute; right:13px; top:92px; font-family:var(--mono); font-size:10px; color:var(--ink-faint); }

  /* =========================================================
   * ④ スタッツ（右上） 170x54 @ (1728, 18)
   * ======================================================= */
  #stats{ left:1728px; top:18px; width:170px; height:54px; font-family:var(--mono); }
  #stats .line{ position:absolute; left:12px; right:12px; font-size:12px; color:var(--ink-dim);
                display:flex; justify-content:space-between; }
  #stats .line b{ color:var(--ink); font-weight:600; }
  #stats .l1{ top:11px; } #stats .l2{ top:29px; }

  /* =========================================================
   * ② ボスHP（上中央） 620x74 @ (650, 18)
   * ======================================================= */
  #boss{ left:650px; top:18px; width:620px; height:74px; }
  #boss .glyph{ position:absolute; left:16px; top:14px; width:22px; height:22px;
                background:linear-gradient(135deg,#D7D7DD,#A9A9B3); }
  #boss .bn{ position:absolute; left:48px; top:15px; font-size:15px; font-weight:700; }
  #boss .bn small{ font-family:var(--mono); font-weight:400; color:var(--ink-dim); font-size:11px; }
  #boss .phase{ position:absolute; right:16px; top:14px; height:22px; line-height:22px; padding:0 10px;
                font-family:var(--mono); font-size:10px; letter-spacing:.12em; color:#FF6B74; }
  #boss .phase .pf{ position:absolute; inset:0; background:rgba(232,17,35,.16);
                    border:1px solid rgba(232,17,35,.45); }
  #boss .phase span{ position:relative; }
  #boss .bar{ left:16px; top:46px; width:588px; height:14px; }

  /* =========================================================
   * ⑤ 装備スロット（右下） 64x64 x3 @ 右端1898 / 下端1060
   * ======================================================= */
  #equip{ position:absolute; left:1674px; top:996px; width:224px; height:64px; }
  .slot{ position:absolute; top:0; width:64px; height:64px; }
  .slot.s1{ left:0; } .slot.s2{ left:80px; } .slot.s3{ left:160px; }
  .slot .sfill{ position:absolute; inset:0; background:var(--panel); }
  .slot .sframe{ position:absolute; inset:0; border:1px solid var(--border); }
  /* アクティブ枠：外側グローは画像必須。ここでは box-shadow で代役表示 */
  .slot.act .sframe{ border-color:var(--blue); box-shadow:0 0 0 1px rgba(0,164,239,.45), 0 0 18px -2px var(--blue); }
  .slot img{ position:absolute; left:8px; top:6px; width:44px; height:44px; }
  .slot.empty img{ opacity:.32; }
  .slot .lbl{ position:absolute; left:0; right:0; bottom:4px; text-align:center; font-size:8px;
              letter-spacing:.08em; color:var(--ink-faint); }
  .slot .key{ position:absolute; left:-9px; top:-9px; width:20px; height:20px;
              font-family:var(--mono); font-size:10px; line-height:20px; text-align:center; color:var(--ink-dim); }
  .slot .key .kf{ position:absolute; inset:0; background:#0E1420; border:1px solid var(--border); }
  .slot .key span{ position:relative; }

  /* =========================================================
   * ⑥ レティクル（中央 78x78）
   *   外周リング＝drawCircle(非塗り)、ティック＝drawBox、中心＝drawCircle(塗り)
   *   溜め進捗＝円周上に並べた 24 個の drawCircle（円弧は描けないため）
   * ======================================================= */
  #reticle{ position:absolute; left:921px; top:501px; width:78px; height:78px; }
  #reticle .ring{ position:absolute; left:9px; top:9px; width:60px; height:60px;
                  border:2px solid rgba(255,255,255,.16); border-radius:50%; }
  #reticle .dot{ position:absolute; left:36px; top:36px; width:6px; height:6px; background:var(--ink); border-radius:50%; }
  #reticle .tick{ position:absolute; background:var(--ink); }
  #reticle .t-up{ left:38px; top:0; width:2px; height:10px; }
  #reticle .t-dn{ left:38px; bottom:0; width:2px; height:10px; }
  #reticle .t-lf{ left:0; top:38px; width:10px; height:2px; }
  #reticle .t-rt{ right:0; top:38px; width:10px; height:2px; }
  #reticle .cd{ position:absolute; width:5px; height:5px; border-radius:50%;
                background:rgba(255,255,255,.10); margin:-2.5px 0 0 -2.5px; }
  #reticle .cd.on{ background:var(--cyan); }

  /* =========================================================
   * 低HP赤フチ（全画面ビネット）— 画像必須
   * ======================================================= */
  #lowhp{ position:absolute; inset:0; pointer-events:none; display:none;
          background:radial-gradient(ellipse at center, transparent 52%, rgba(232,17,35,.30) 100%); }
  body.lowhp #lowhp{ display:block; animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:.75} 50%{opacity:1} }

  /* =========================================================
   * 画像 / プリミティブ の内訳オーバーレイ
   * ======================================================= */
  .mark{ position:absolute; inset:0; display:none; pointer-events:none; }
  body.marks .mark{ display:block; }
  .mark.img{ outline:1px dashed rgba(255,200,61,.95); outline-offset:1px; }
  .mark.prim{ outline:1px dashed rgba(54,208,123,.85); outline-offset:1px; }
  .mark::after{ content:attr(data-t); position:absolute; left:0; top:-13px; font-family:var(--mono);
                font-size:9px; white-space:nowrap; padding:0 3px; }
  .mark.img::after{ background:rgba(255,200,61,.92); color:#161200; }
  .mark.prim::after{ background:rgba(54,208,123,.9); color:#00190C; }
  .mark.below::after{ top:auto; bottom:-13px; }

  /* ---- 操作パネル（プロトタイプ用。実装には含めない） ---- */
  #ctrl{ position:fixed; left:12px; bottom:12px; z-index:20; display:flex; gap:8px; flex-wrap:wrap;
         font-family:var(--mono); font-size:11px; }
  #ctrl button{ background:rgba(17,22,31,.92); color:#C9D4E3; border:1px solid #2A3547;
                padding:7px 12px; cursor:pointer; font:inherit; }
  #ctrl button:hover{ border-color:var(--blue); }
  #ctrl button.on{ border-color:var(--blue); color:#fff; background:rgba(0,95,138,.55); }
  #legend{ position:fixed; right:12px; bottom:12px; z-index:20; font-family:var(--mono); font-size:11px;
           background:rgba(17,22,31,.92); border:1px solid #2A3547; padding:8px 12px; color:#9DB0C7;
           display:none; }
  body.marks #legend{ display:block; }
  #legend i{ display:inline-block; width:10px; height:10px; margin-right:6px; vertical-align:-1px; }
</style>
</head>
<body class="imgpanel">

<div id="stage">
  <div id="bg"><div class="floorline"></div></div>

  <!-- ================= ③ 目標／現在地 ================= -->
  <div id="obj" class="panel">
    <div class="fill"></div><div class="frame"></div>
    <div class="corner tl"></div><div class="corner br"></div>
    <div class="cap"><span>MAC 出現条件</span><span>OBJECTIVE</span></div>
    <div class="count">04</div>
    <div class="goaltxt">体 倒すと<br><b>Mac が出現</b></div>
    <div class="sep"></div>
    <div class="prefix">CURRENT DIRECTORY</div>
    <div class="path">C:\Users\Player\Desktop</div>
    <div class="depth">0.0m</div>
    <div class="mark img" data-t="panel_objective.png 230x118"></div>
  </div>

  <!-- ================= ② ボスHP ================= -->
  <div id="boss" class="panel">
    <div class="fill"></div><div class="frame"></div>
    <div class="corner tl"></div><div class="corner br"></div>
    <div class="glyph"><div class="mark img" data-t="boss_glyph.png 22x22"></div></div>
    <div class="bn">MacBook <small>/ boss</small></div>
    <div class="phase"><div class="pf"></div><span>PHASE 2 · AWAKENED</span>
      <div class="mark img" data-t="phase_pill.png"></div></div>
    <div class="bar" id="bossBar"></div>
    <div class="mark img" data-t="panel_boss.png 620x74"></div>
  </div>

  <!-- ================= ④ スタッツ ================= -->
  <div id="stats" class="panel">
    <div class="fill"></div><div class="frame"></div>
    <div class="corner tl"></div><div class="corner br"></div>
    <div class="line l1"><span>KILLED</span><b>12</b></div>
    <div class="line l2"><span>TIME</span><b>03:41</b></div>
    <div class="mark img" data-t="panel_stats.png 170x54"></div>
  </div>

  <!-- ================= ① プレイヤーHP ================= -->
  <div id="php" class="panel">
    <div class="fill"></div><div class="frame"></div>
    <div class="corner tl"></div><div class="corner br"></div>
    <div class="name">PLAYER STATUS</div>
    <div class="num" id="hpNum">HP 640 / 1000</div>
    <div class="bar" id="hpBar"></div>
    <div class="chip a"><div class="cf"></div><span>SHIELD 0</span></div>
    <div class="chip b"><div class="cf"></div><span>no debuff</span></div>
    <div class="mark img" data-t="panel_player.png 270x92"></div>
  </div>

  <!-- ================= ⑤ 装備スロット ================= -->
  <div id="equip">
    <div class="slot s1 act">
      <div class="sfill"></div><div class="sframe"></div>
      <img src="../assets/images/ui/select/exe.png" alt="exe">
      <div class="lbl">近接</div>
      <div class="key"><div class="kf"></div><span>1</span></div>
      <div class="mark img below" data-t="slot_frame_active.png"></div>
    </div>
    <div class="slot s2">
      <div class="sfill"></div><div class="sframe"></div>
      <img src="../assets/images/ui/select/doc.png" alt="doc">
      <div class="lbl">遠隔</div>
      <div class="key"><div class="kf"></div><span>2</span></div>
      <div class="mark img below" data-t="slot_frame.png"></div>
    </div>
    <div class="slot s3 empty">
      <div class="sfill"></div><div class="sframe"></div>
      <img src="../assets/images/ui/select/emp.png" alt="empty">
      <div class="lbl">空き</div>
      <div class="key"><div class="kf"></div><span>3</span></div>
      <div class="mark img below" data-t="emp.png（select流用）"></div>
    </div>
  </div>

  <!-- ================= ⑥ レティクル ================= -->
  <div id="reticle">
    <div class="ring"></div>
    <div class="tick t-up"></div><div class="tick t-dn"></div>
    <div class="tick t-lf"></div><div class="tick t-rt"></div>
    <div class="dot"></div>
    <div class="mark prim" data-t="drawCircle + drawBox（画像なし）"></div>
  </div>

  <!-- ================= 低HPビネット ================= -->
  <div id="lowhp"><div class="mark img" data-t="vignette_lowhp.png（全画面へ拡大）"></div></div>
</div>

<div id="ctrl">
  <button id="bPanel" class="on">パネル：画像</button>
  <button id="bMarks">内訳を表示</button>
  <button id="bLow">低HP状態</button>
  <button id="bBoss" class="on">ボスHP表示</button>
  <button id="bCharge">溜め進行</button>
</div>

<div id="legend">
  <div><i style="background:rgba(255,200,61,.92)"></i>画像が必要</div>
  <div><i style="background:rgba(54,208,123,.9)"></i>プリミティブのみ</div>
  <div style="margin-top:5px;color:#5E708A">枠なし＝drawBox/drawText で描画</div>
</div>

<script>
/* =========================================================
 * ステージを実寸のままビューポートへ収める
 * ======================================================= */
const stage = document.getElementById('stage');
function fit(){
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

/* =========================================================
 * バーを「drawBox の積み重ね」で構築する。
 * 縦を3段に割って上ほど明るい単色を置き、擬似的にグラデを作る。
 * これが実装時の drawBox 呼び出しとそのまま1対1で対応する。
 * ======================================================= */
function buildBar(el, ratio, bands, opt = {}){
  const w = el.offsetWidth, h = el.offsetHeight;
  el.innerHTML = '';
  const groove = document.createElement('div'); groove.className = 'groove'; el.appendChild(groove);

  const wrap = document.createElement('div'); wrap.className = 'fillwrap';
  wrap.style.width = Math.round((w - 2) * ratio) + 'px';
  el.appendChild(wrap);

  const inner = h - 2;
  const seg = inner / bands.length;
  bands.forEach((c, i) => {
    const b = document.createElement('div'); b.className = 'band';
    b.style.top = Math.round(i * seg) + 'px';
    b.style.height = Math.ceil(seg) + 'px';
    b.style.background = c;
    wrap.appendChild(b);
  });

  /* 目盛り（drawBox の縦線）。残量の把握を助ける */
  if (opt.ticks){
    for (let i = 1; i < opt.ticks; i++){
      const t = document.createElement('div'); t.className = 'tickline';
      t.style.left = Math.round((w - 2) * i / opt.ticks) + 'px';
      el.appendChild(t);
    }
  }

  const gf = document.createElement('div'); gf.className = 'grooveFrame'; el.appendChild(gf);

  const m = document.createElement('div');
  m.className = 'mark prim';
  m.dataset.t = opt.label || 'drawBox x' + (bands.length + 2);
  el.appendChild(m);
}

/* HP 64%：上ほど明るい緑3段 */
const HP_BANDS   = ['#4ADC8E', '#36D07B', '#1FA85C'];
const BOSS_BANDS = ['#F0323F', '#E81123', '#8A0E18'];

function refreshBars(){
  buildBar(document.getElementById('hpBar'), 0.64, HP_BANDS, { ticks: 4, label:'drawBox×5（溝＋3段＋枠）' });
  buildBar(document.getElementById('bossBar'), 0.78, BOSS_BANDS, { ticks: 5, label:'drawBox×5' });
}
refreshBars();

/* =========================================================
 * 溜め進捗リング：円弧が描けないので、円周上に 24 個の
 * drawCircle を並べ、進捗ぶんだけシアンで塗る方式。
 * ======================================================= */
const RETICLE = document.getElementById('reticle');
const CHARGE_DOTS = 24, CHARGE_R = 30;
const chargeDots = [];
for (let i = 0; i < CHARGE_DOTS; i++){
  const a = -Math.PI / 2 + i * (Math.PI * 2 / CHARGE_DOTS);
  const d = document.createElement('div'); d.className = 'cd';
  d.style.left = (39 + Math.cos(a) * CHARGE_R) + 'px';
  d.style.top  = (39 + Math.sin(a) * CHARGE_R) + 'px';
  RETICLE.appendChild(d);
  chargeDots.push(d);
}
function setCharge(r){
  const n = Math.round(r * CHARGE_DOTS);
  chargeDots.forEach((d, i) => d.classList.toggle('on', i < n));
}
setCharge(0);

let charging = false, chargeT = 0, last = performance.now();
function tick(t){
  requestAnimationFrame(tick);
  const dt = Math.min((t - last) / 1000, .1); last = t;
  if (charging){
    chargeT = (chargeT + dt * .45) % 1.35;
    setCharge(Math.min(chargeT, 1));
  }
}
requestAnimationFrame(tick);

/* ---- トグル ---- */
function toggle(id, fn){
  const b = document.getElementById(id);
  b.onclick = () => { b.classList.toggle('on'); fn(b.classList.contains('on')); };
}
toggle('bPanel', on => {
  document.body.classList.toggle('imgpanel', on);
  document.getElementById('bPanel').textContent = on ? 'パネル：画像' : 'パネル：drawBox';
});
document.getElementById('bPanel').classList.add('on');
toggle('bMarks', on => document.body.classList.toggle('marks', on));
toggle('bLow',   on => {
  document.body.classList.toggle('lowhp', on);
  document.getElementById('hpNum').textContent = on ? 'HP 120 / 1000' : 'HP 640 / 1000';
  buildBar(document.getElementById('hpBar'), on ? .12 : .64,
    on ? ['#FF5A63','#E81123','#8A0E18'] : HP_BANDS, { ticks:4, label:'drawBox×5（溝＋3段＋枠）' });
});
toggle('bBoss',  on => document.getElementById('boss').style.display = on ? '' : 'none');
document.getElementById('bBoss').classList.add('on');
toggle('bCharge', on => { charging = on; if (!on){ chargeT = 0; setCharge(0); } });
</script>
</body>
</html>
