function canvasTex(w, h, draw, opts = {}) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  if (opts.repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...opts.repeat); }
  return t;
}

/* =========================================================
 * ステージ構築（元マップと同一の5区画ルート）

const stage = new THREE.Group();
scene.add(stage);

const DEG = Math.PI / 180;
const SLOPE_DEG = 13;
const mat = (opt) => new THREE.MeshStandardMaterial(Object.assign({ roughness: 0.85, metalness: 0.05 }, opt));
const emissiveMat = (tex, intensity, extra = {}) =>
  mat(Object.assign({ map: tex, emissiveMap: tex, emissive: 0xffffff, emissiveIntensity: intensity }, extra));

function box(w, h, d, m) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); }

function addFloor(cx, cy, cz, sx, sz, tex = folderFloorTex, glow = 0.5) {
  const f = box(sx, 24, sz, emissiveMat(tex, glow));
  f.position.set(cx, cy - 12, cz);
  stage.add(f);
  return f;
}

function addSlope(startX, topY, startZ, len, width, axis, tex) {
  const drop = len * Math.sin(SLOPE_DEG * DEG);
  const span = len * Math.cos(SLOPE_DEG * DEG);
  const s = box(width, 24, len, emissiveMat(tex, 0.8));
  if (axis === 'z+') {
    s.position.set(startX, topY - 12 - drop / 2, startZ + span / 2);
    s.rotation.x = SLOPE_DEG * DEG;
    stage.add(s);
    return { x: startX, y: topY - drop, z: startZ + span, mesh: s };
  }
  if (axis === 'x-') {
    s.position.set(startX - span / 2, topY - 12 - drop / 2, startZ);
    s.rotation.y = Math.PI / 2;
    s.rotation.x = -SLOPE_DEG * DEG;
    stage.add(s);
    return { x: startX - span, y: topY - drop, z: startZ, mesh: s };
  }
  s.position.set(startX + span / 2, topY - 12 - drop / 2, startZ);
  s.rotation.y = Math.PI / 2;
  s.rotation.x = SLOPE_DEG * DEG;
  stage.add(s);
  return { x: startX + span, y: topY - drop, z: startZ, mesh: s };
}

function addCorridor(cx, cy, cz, len, axis, width = 1000, wallH = 620) {
  const alongZ = axis === 'z';
  addFloor(cx, cy, cz, alongZ ? width : len, alongZ ? len : width, sys32FloorTex, 0.55);
  for (const side of [-1, 1]) {
    const w = box(len, wallH, 30, emissiveMat(dllWallTex, 0.5));
    if (alongZ) {
      w.position.set(cx + side * (width / 2 + 15), cy + wallH / 2, cz);
      w.rotation.y = Math.PI / 2;
    } else {
      w.position.set(cx, cy + wallH / 2, cz + side * (width / 2 + 15));
    }
    stage.add(w);
  }
}

function addPillar(x, floorY, z) {
  const p = box(240, 620, 240, emissiveMat(pillarTex, 0.55));
  p.position.set(x, floorY + 310, z);
  stage.add(p);
}

function addBlock(tex, x, floorY, z, ry = 0, size = 220, lift = 0) {
  const b = box(size, size, size, emissiveMat(tex, 0.45));
  b.position.set(x, floorY + size / 2 + lift, z);
  b.rotation.y = ry;
  stage.add(b);
}

function addWindowWall(title, cx, cy, cz, w, h, ry = 0) {
  const t = windowWallTex(title);
  const m = box(w, h, 40, emissiveMat(t, 0.52, { transparent: true, opacity: 0.94 }));
  m.position.set(cx, cy + h / 2, cz);
  m.rotation.y = ry;
  stage.add(m);
}

{

    side: THREE.BackSide,
    depthWrite: false,
    fog: false,
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      varying vec3 vPos;
      void main() {
        vPos = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }`,
    fragmentShader: `
      varying vec3 vPos;
      uniform float uTime;
      /* 簡易ハッシュノイズ */
      float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
      void main() {
        float h = normalize(vPos).y * 0.5 + 0.5;           /* 0=下 1=上 */
        vec3 bottom = vec3(0.000, 0.002, 0.006);
        vec3 mid    = vec3(0.004, 0.014, 0.030);
        vec3 top    = vec3(0.001, 0.004, 0.012);
        vec3 col = mix(bottom, mid, smoothstep(0.30, 0.55, h));
        col = mix(col, top, smoothstep(0.60, 0.95, h));
        /* かすかな星雲のムラ */
        vec2 uv = normalize(vPos).xz * 6.0 + normalize(vPos).y;
        float n = hash(floor(uv * 8.0)) * 0.5 + hash(floor(uv * 17.0)) * 0.5;
        col += vec3(0.0, 0.010, 0.022) * smoothstep(0.75, 1.0, n) * smoothstep(0.35, 0.7, h);
        gl_FragColor = vec4(col, 1.0);
      }`
  });

function makeGlowSprite(inner = 'rgba(255,255,255,1)', outer = 'rgba(255,255,255,0)') {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  const rad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  rad.addColorStop(0, inner);
  rad.addColorStop(0.25, 'rgba(255,255,255,0.85)');
  rad.addColorStop(0.6, 'rgba(255,255,255,0.18)');
  rad.addColorStop(1, outer);
  g.fillStyle = rad;
  g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

      float core = pow(max(w, 0.0), 1.6 + (1.0 - vUv.x) * 5.0);
      float a = head * core * uOpacity;
      /* 頭に近いほど白熱 */
      vec3 col = mix(uColor, vec3(1.0), pow(vUv.x, 6.0) * 0.85);
      gl_FragColor = vec4(col, a);
    }`

function updateMeteors(dt) {
  for (const m of meteors) {
    m.life -= dt;
    if (m.life <= 0) { respawnMeteor(m); continue; }
    m.pos.addScaledVector(m.vel, dt);

    /* フェード包絡線：出現でスッと明るく、消滅でスッと消える */
    const t = 1 - m.life / m.maxLife;
    const env = Math.min(1, t / 0.12) * Math.min(1, (1 - t) / 0.25);
    const op = env * (m.big ? 1.0 : 0.85);
    m.trail.material.uniforms.uOpacity.value = op;
    m.head.material.opacity = op;

    /* 軸ビルボード：進行方向を長軸に、面をカメラへ向ける */
    _v1.copy(m.vel).normalize();                        /* dir */
    _v2.copy(camera.position).sub(m.pos).normalize();   /* toCam */
    _v3.crossVectors(_v1, _v2);
    if (_v3.lengthSq() < 1e-6) _v3.set(0, 1, 0);
    _v3.normalize();                                    /* side */
    _v2.crossVectors(_v3, _v1).normalize();             /* normal */
    _m.makeBasis(_v1, _v3, _v2);
    m.trail.quaternion.setFromRotationMatrix(_m);
    m.trail.scale.set(m.len, m.width, 1);
    /* トレイルは頭から後方へ伸びる：中心を頭の後方 len/2 に置く */
    m.trail.position.copy(m.pos).addScaledVector(_v1, -m.len / 2);
    m.head.position.copy(m.pos);
    const flicker = 0.9 + Math.sin(performance.now() * 0.02 + m.len) * 0.1;
    m.head.scale.setScalar(m.headSize * flicker);
  }
}

function buildStreamCurve(idx) {
  /* マップ上空を蛇行しながら、最後は必ずアリーナ上空の白い光へ収束 */
  const side = (idx % 2 === 0) ? 1 : -1;
  const lat = side * (2200 + idx * 1300 + Math.random() * 1200);
  const h0 = 2000 + Math.random() * 2600;
  const pts = [
    new THREE.Vector3(SKY_CENTER.x + lat * 1.6, h0 + 800, -7000 - Math.random() * 3000),
    new THREE.Vector3(SKY_CENTER.x + lat * 1.2, h0 + Math.random() * 600, 1500),
    new THREE.Vector3(SKY_CENTER.x + lat * 1.5, h0 - 400, 7500),
    new THREE.Vector3(SKY_CENTER.x + lat * 0.8, h0 - 900 + Math.random() * 500, 13500),
    new THREE.Vector3(SKY_CENTER.x + lat * 1.1, h0 - 1300, 19000),
    new THREE.Vector3(R4X + side * 900, ARENA_GLOW.y + 1800, R5Z - 3200),
    new THREE.Vector3(ARENA_GLOW.x, ARENA_GLOW.y + 250, ARENA_GLOW.z)
  ];
  return new THREE.CatmullRomCurve3(pts, false, 'catmullrom', 0.35);
}

for (let s = 0; s < STREAM_DEFS.length; s++) {

  const points = new THREE.Points(geo, pm);
  points.frustumCulled = false;
  skyGroup.add(points);

  const parts = [];
  const baseColor = new THREE.Color(def.color);
  const white = new THREE.Color('#FFFFFF');
  for (let i = 0; i < N; i++) {
    parts.push({
      t: Math.random(),

      angSpd: (Math.random() - 0.5) * 1.6,
      bright: 0.5 + Math.random() * 0.5
    });
  }
  streams.push({ curve, lut, points, geo, parts, baseColor, white, N });
}

const UP = new THREE.Vector3(0, 1, 0);

function lutPoint(lut, t, out) {
  const f = t * (lut.length - 1);
  const i = Math.min(lut.length - 2, Math.floor(f));
  out.copy(lut[i]).lerp(lut[i + 1], f - i);
  return out;
}

function updateStreams(dt, time) {
  for (const st of streams) {
    const pos = st.geo.attributes.position.array;
    const col = st.geo.attributes.color.array;
    for (let i = 0; i < st.N; i++) {
      const p = st.parts[i];
      p.t += p.spd * dt;
      if (p.t >= 1) { p.t -= 1; p.rad = Math.pow(Math.random(), 0.7) * 300; }
      p.ang += p.angSpd * dt;

      lutPoint(st.lut, p.t, _sp);
      lutPoint(st.lut, Math.min(1, p.t + 0.004), _tan).sub(_sp).normalize();
      _n1.crossVectors(_tan, UP);
      if (_n1.lengthSq() < 1e-6) _n1.set(1, 0, 0);
      _n1.normalize();
      _n2.crossVectors(_tan, _n1).normalize();

      /* 終点（白い光）に近づくほど細く収束 */
      const squeeze = 1.0 - Math.pow(p.t, 3.0) * 0.85;
      const r = p.rad * squeeze;
      const ox = Math.cos(p.ang) * r, oy = Math.sin(p.ang) * r;
      pos[i*3]   = _sp.x + _n1.x * ox + _n2.x * oy;
      pos[i*3+1] = _sp.y + _n1.y * ox + _n2.y * oy;
      pos[i*3+2] = _sp.z + _n1.z * ox + _n2.z * oy;

      /* 色：基本色 → 終点付近で白熱、ゆらぎで明滅 */
      const heat = Math.pow(p.t, 4.0);
      const tw = p.bright * (0.75 + 0.25 * Math.sin(time * 3.0 + i * 1.7));
      const rC = st.baseColor.r + (st.white.r - st.baseColor.r) * heat;
      const gC = st.baseColor.g + (st.white.g - st.baseColor.g) * heat;
      const bC = st.baseColor.b + (st.white.b - st.baseColor.b) * heat;
      col[i*3]   = rC * tw;
      col[i*3+1] = gC * tw;
      col[i*3+2] = bC * tw;
    }
    st.geo.attributes.position.needsUpdate = true;
    st.geo.attributes.color.needsUpdate = true;
  }
}

/* ---------- 5) 漂うデータ片 ---------- */
const PCOUNT = 900;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(PCOUNT * 3);
for (let i = 0; i < PCOUNT; i++) {
  pPos[i*3]   = (Math.random() - 0.5) * 18000 - 1000;
  pPos[i*3+1] = (Math.random() - 0.5) * 8000 - 1400;
  pPos[i*3+2] = Math.random() * 30000 - 3000;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const drift = new THREE.Points(pGeo, new THREE.PointsMaterial({
  color: C.blue, size: 12, transparent: true, opacity: 0.4, sizeAttenuation: true,
  map: glowTex, depthWrite: false, blending: THREE.AdditiveBlending
}));
scene.add(drift);

/* =========================================================
 * カメラ：オート巡回（空を見上げるモーション付き）⇄ 自由視点
 * ======================================================= */
const tourCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, 800, -2900),
  new THREE.Vector3(-700, 450, 0),
  new THREE.Vector3(200, 200, 2200),
  new THREE.Vector3(-500, Y2 + 450, R2Z - 300),
  new THREE.Vector3(900, Y2 + 380, R2Z + 500),
  new THREE.Vector3(T1X + 1000, Y2 + 350, R2Z + 500),
  new THREE.Vector3(J1X, Y2 + 300, R2Z + 1400),
  new THREE.Vector3(J1X, sB1.y + 350, J2Z),
  new THREE.Vector3(J1X - 1200, Y3 + 400, J2Z),
  new THREE.Vector3(J3X, Y3 + 320, J2Z + 1200),
  new THREE.Vector3(J3X, Y3 + 320, J4Z - 300),
  new THREE.Vector3(J3X - 1300, Y3 + 320, J4Z),
  new THREE.Vector3(TEMP_X + 400, Y3 + 350, J4Z),
  new THREE.Vector3(J5X, Y3 + 320, J4Z + 1300),
  new THREE.Vector3(J5X, Y3 + 250, J6Z + 900),
  new THREE.Vector3(R4X - 1300, Y4 + 500, R4Z - 700),
  new THREE.Vector3(R4X + 1000, Y4 + 420, R4Z + 800),
  new THREE.Vector3(R4X, Y4 + 600, GATE_Z - 900),
  new THREE.Vector3(R4X, Y4 + 300, GATE_Z + 600),
  new THREE.Vector3(R4X - 900, Y5 + 500, R5Z - 800),
  new THREE.Vector3(R4X, Y5 + 1000, R5Z + 1500),
  new THREE.Vector3(R4X + 1700, Y5 + 1500, R5Z - 300),
  new THREE.Vector3(0, 1800, 12000),
  new THREE.Vector3(0, 1400, 2000)
], true, 'catmullrom', 0.3);

let mode = 'tour';
let tourT = 0;
const TOUR_SPEED = 1 / 120;      /* 一周 120 秒 */

/* 見上げモーション：区間ごとに視線が空へ持ち上がる（流星鑑賞パート） */
function gazeLift(t) {
  /* 3 つの山（序盤・System32 明け・全景引き）で空を見上げる */
  const peaks = [
    { c: 0.055, w: 0.045, amp: 2600 },
    { c: 0.640, w: 0.040, amp: 2200 },
    { c: 0.935, w: 0.055, amp: 3400 },
  ];
  let lift = 0;
  for (const p of peaks) {
    const d = Math.min(Math.abs(t - p.c), Math.abs(t - p.c + 1), Math.abs(t - p.c - 1));
    const k = Math.max(0, 1 - d / p.w);
    lift += p.amp * k * k * (3 - 2 * k);   /* smoothstep 形状 */
  }
  return lift;
}

let yaw = 0, pitch = -0.15, dragging = false;
const keys = new Set();
renderer.domElement.addEventListener('pointerdown', (e) => {
  if (mode !== 'fly') return;
  dragging = true;
  renderer.domElement.setPointerCapture(e.pointerId);
});
window.addEventListener('pointerup', () => dragging = false);
renderer.domElement.addEventListener('pointermove', (e) => {
  if (mode !== 'fly' || !dragging) return;
  yaw   -= e.movementX * 0.0032;
  pitch -= e.movementY * 0.0032;
  pitch = Math.max(-1.5, Math.min(1.5, pitch));
});
window.addEventListener('keydown', e => keys.add(e.code));
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

const btnTour = document.getElementById('btnTour');
const btnFly = document.getElementById('btnFly');
function setMode(m) {
  mode = m;
  btnTour.classList.toggle('active', m === 'tour');
  btnFly.classList.toggle('active', m === 'fly');
  document.getElementById('flyHint').style.display = m === 'fly' ? 'block' : 'none';
  if (m === 'fly') {
    const e = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
    yaw = e.y; pitch = e.x;
  }
}
btnTour.onclick = () => setMode('tour');
btnFly.onclick = () => setMode('fly');

/* =========================================================
 * ゾーン表示
 * ======================================================= */
const zoneEl = document.getElementById('zone');
const depthEl = document.getElementById('depth');
let currentZone = '';
function zoneAt(p) {
  if (p.z > GATE_Z + 300 || (p.z > sD.mesh.position.z - 1000 && p.y < Y4 - 200)) return 'C:\\Program Files\\Apple\\';
  if (p.z > J6Z - 400) return 'C:\\Program Files\\';
  if (p.x < TEMP_X + 900 && Math.abs(p.z - J4Z) < 900) return 'C:\\Windows\\Temp\\';
  if (p.z > J2Z - 700) return 'C:\\Windows\\System32\\';
  if (p.z > 2600) return 'C:\\Users\\Player\\Downloads';
  return 'C:\\Users\\Player\\Desktop';
}
function updateZone(p) {
  const name = zoneAt(p);
  depthEl.textContent = 'DEPTH: ' + Math.max(0, -p.y / 100).toFixed(1) + 'm';
  if (name !== currentZone) {
    currentZone = name;
    zoneEl.style.opacity = 0;
    setTimeout(() => {
      const isApple = name.includes('Apple');
      const isTemp = name.includes('Temp');
      zoneEl.innerHTML = '<span class="path-prefix">CURRENT DIRECTORY</span>' + name;
      zoneEl.style.color = isApple ? '#F5F5F7' : (isTemp ? '#FFC83D' : '#E8F2FC');
      zoneEl.style.textShadow = isApple
        ? '0 0 18px rgba(232,17,35,0.5)'
        : (isTemp ? '0 0 18px rgba(255,200,61,0.5)' : '0 0 18px rgba(0,164,239,0.55)');
      zoneEl.style.opacity = 1;
    }, 400);
  }
}

/* =========================================================
 * ループ
 * ======================================================= */
let last = performance.now();
function tick(t) {
  requestAnimationFrame(tick);
  const dt = Math.min((t - last) / 1000, 0.1); last = t;
  const time = t / 1000;

  for (const tx of scrollTexes) tx.offset.y = (tx.offset.y - dt * 0.12) % 1;

  for (const a of actors) {
    a.mesh.position.y = a.baseY + Math.sin(time * 1.4 + a.phase) * a.bob;
    a.mesh.rotation.y += dt * 0.25;
  }
  dangerRing.scale.setScalar(1 + Math.sin(time * 2.2) * 0.05);
  dangerRing.material.emissiveIntensity = 1.8 + Math.sin(time * 2.2) * 0.7;
  macGroup.position.y = Y5 + Math.sin(time * 0.9) * 18;
  if (window.__tempOrb) {
    window.__tempOrb.rotation.y = time * 1.2;
    window.__tempOrb.position.y = Y3 + 160 + Math.sin(time * 2) * 20;
  }
  if (window.__uacDlg) {
    window.__uacDlg.material.emissiveIntensity = 0.75 + Math.sin(time * 1.8) * 0.2;
  }

  /* --- SKY FLOW 更新 --- */
  if (window.__starMat) window.__starMat.uniforms.uTime.value = time;
  updateMeteors(dt);
  updateStreams(dt, time);
  drift.rotation.y = time * 0.004;

  if (mode === 'tour') {
    tourT = (tourT + dt * TOUR_SPEED) % 1;
    const pos = tourCurve.getPointAt(tourT);
    const ahead = tourCurve.getPointAt((tourT + 0.012) % 1);
    ahead.y += gazeLift(tourT);          /* 流星鑑賞：視線が空へ */
    camera.position.lerp(pos, 0.9);
    camera.lookAt(ahead);
  } else {
    camera.rotation.order = 'YXZ';
    camera.rotation.set(pitch, yaw, 0);
    const speed = 2600 * (keys.has('ShiftLeft') || keys.has('ShiftRight') ? 3 : 1) * dt;
    const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    if (keys.has('KeyW')) camera.position.addScaledVector(fwd, speed);
    if (keys.has('KeyS')) camera.position.addScaledVector(fwd, -speed);
    if (keys.has('KeyA')) camera.position.addScaledVector(right, -speed);
    if (keys.has('KeyD')) camera.position.addScaledVector(right, speed);
    if (keys.has('KeyQ')) camera.position.y -= speed;
    if (keys.has('KeyE')) camera.position.y += speed;
  }

  /* アリーナ接近＋見上げ時にブルーム強化 */
  const dArena = Math.hypot(camera.position.x - R4X, camera.position.z - R5Z);
  const lookUpBoost = mode === 'tour' ? Math.min(1, gazeLift(tourT) / 2600) * 0.25 : 0;
  bloom.strength = 0.8 + Math.max(0, 1 - dArena / 4500) * 0.45 + lookUpBoost;

  updateZone(camera.position);
  composer.render();
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

resize();
requestAnimationFrame(tick);
setTimeout(() => document.getElementById('fade').style.opacity = 0, 200);
</script>
