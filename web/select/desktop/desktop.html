<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <base href="https://game.web/">
    <link rel="stylesheet" href="common/common.css">
    <link rel="stylesheet" href="select/desktop/desktop.css">
</head>
<body>
    <div class="desktop-area">
        <canvas id="matrix-bg"></canvas>

        <!--
            デスクトップアイコン。
            1列に並べると縦に伸びて、Debugの小さいウィンドウでは下の難易度ウィンドウに隠れる。
            4 / 3 / 4 の3列に分けて、どの解像度でも全アイコンが見えるようにしている
        -->
        <div class="desktop-icons">
            <!-- 1列目: 標準 Windows アプリ -->
            <div class="icon-column">
                <div class="desk-icon" ondblclick="launchApp('cmd')">
                    <img src="https://assets.game.web/images/ui/app/cmdIcon.png" alt="">
                    <span>コマンド<br>プロンプト</span>
                </div>
                <div class="desk-icon" ondblclick="launchApp('taskmgr')">
                    <img src="https://assets.game.web/images/ui/app/taskManager.png" alt="">
                    <span>タスク<br>マネージャー</span>
                </div>
                <div class="desk-icon" ondblclick="launchApp('notepad')">
                    <img src="https://assets.game.web/images/ui/app/notepad.png" alt="">
                    <span>メモ帳</span>
                </div>
                <div class="desk-icon" ondblclick="launchApp('recyclebin')">
                    <img src="https://assets.game.web/images/ui/app/gomibako.png" alt="">
                    <span>ごみ箱</span>
                </div>
            </div>
            <!-- 2列目: ゲームの設定ウィンドウ -->
            <div class="icon-column">
                <div class="desk-icon" ondblclick="toggleWindow('diff')">
                    <img src="https://assets.game.web/images/ui/app/diff.png" alt="">
                    <span>難易度設定</span>
                </div>
                <div class="desk-icon" ondblclick="toggleWindow('file')">
                    <img src="https://assets.game.web/images/ui/app/file.png" alt="">
                    <span>ファイル選択</span>
                </div>
                <div class="desk-icon" ondblclick="toggleWindow('param')">
                    <img src="https://assets.game.web/images/ui/app/param.png" alt="">
                    <span>パラメータ</span>
                </div>
                <!-- 音量と操作の設定。1列目・3列目が4段なので、ここも4段目に置いて高さを揃える -->
                <div class="desk-icon" ondblclick="toggleWindow('settings')">
                    <img src="https://assets.game.web/images/ui/app/settings.png" alt="">
                    <span>設定</span>
                </div>
            </div>
            <!-- 3列目: 説明と、この画面の出口。ルール説明は初回ガイドの締めで指し示すので先頭へ置く。
                 セレクト画面ではEscのポーズメニューを開けないため、
                 タイトルへ戻る／終了はここが唯一の入口になる -->
            <div class="icon-column">
                <div class="desk-icon" id="icon-rules" ondblclick="toggleWindow('rules')">
                    <img src="https://assets.game.web/images/ui/app/Rules.png" alt="">
                    <span>ルール説明.txt</span>
                </div>
                <!-- 右下のボタンに気づかない人のための2つ目の入口。
                     出撃の確認は C++ 側（Win32のダイアログ）が出す。
                     ここでHTMLのモーダルを出しても、他のウィンドウは別HWNDなので
                     その背面に回ってしまい、確認として機能しない -->
                <div class="desk-icon" id="icon-start" ondblclick="startGame()">
                    <img src="https://assets.game.web/images/ui/icons/gameicon.ico" alt="">
                    <span>ゲーム開始.exe</span>
                </div>
                <!-- 戻る／終了の確認も同じ理由で C++ 側のダイアログに任せる -->
                <div class="desk-icon" ondblclick="backToTitle()">
                    <img src="https://assets.game.web/images/ui/app/home.png" alt="">
                    <span>タイトルへ戻る</span>
                </div>
                <div class="desk-icon" ondblclick="quitGame()">
                    <span class="desk-icon-emoji">⏻</span>
                    <span>シャットダウン</span>
                </div>
            </div>
        </div>
    </div>

    <div class="taskbar">
        <div class="taskbar-apps">
            <div class="taskbar-app active" id="app-diff" data-tooltip="難易度" onclick="toggleWindow('diff')">
                <img class="app-icon" src="https://assets.game.web/images/ui/app/diff.png">
            </div>
            <div class="taskbar-app active" id="app-file" data-tooltip="ファイル" onclick="toggleWindow('file')">
                <img class="app-icon" src="https://assets.game.web/images/ui/app/file.png">
            </div>
            <div class="taskbar-app active" id="app-param" data-tooltip="パラメータ" onclick="toggleWindow('param')">
                <img class="app-icon" src="https://assets.game.web/images/ui/app/param.png">
            </div>
        </div>

        <div class="taskbar-right">
            <!-- デスクトップアイコンと同じ出口をタスクバーにも置く。
                 ウィンドウを開いたままアイコンが隠れても、ここから抜けられる -->
            <div class="taskbar-app" data-tooltip="タイトルへ戻る" onclick="backToTitle()">
                <img class="app-icon" src="https://assets.game.web/images/ui/app/home.png">
            </div>
            <div class="taskbar-app" data-tooltip="シャットダウン" onclick="quitGame()">
                <span class="taskbar-glyph">⏻</span>
            </div>

            <!-- Windows のトレイと同じく、アイコンをまとめて押すとクイック設定が開く。
                 個々のアイコンは押せる場所ではなく、この1つのボタンの顔として並んでいる -->
            <div class="taskbar-app tray" data-tooltip="クイック設定" onclick="toggleQuickSettings()">
                <svg class="tray-glyph" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4">
                    <path d="M2 7.5a11 11 0 0 1 16 0M4.8 10.6a7 7 0 0 1 10.4 0M7.6 13.7a3 3 0 0 1 4.8 0"
                          stroke-linecap="round"/>
                    <circle cx="10" cy="16.4" r="1" fill="currentColor" stroke="none"/>
                </svg>
                <span class="tray-glyph" id="tray-volume"></span>
            </div>

            <div class="clock" id="clock">00:00<br>--/--</div>
            <button class="start-btn" onclick="startGame()">ゲームを開始 →</button>
        </div>
    </div>

    <script src="common/messaging.js"></script>
    <script src="common/pad-nav.js"></script>
    <script src="common/ui-sound.js"></script>
    <script src="select/desktop/desktop-logic.js"></script>
    <script src="select/desktop/desktop-view.js"></script>
</body>
</html>
