<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <base href="https://game.web/">
    <link rel="stylesheet" href="common/common.css">
    <link rel="stylesheet" href="select/file/file.css">
</head>
<body>
    <div class="exp-toolbar">
        <button class="nav-btn" disabled>&#9664;</button>
        <button class="nav-btn" disabled>&#9654;</button>
        <div class="address-bar">
            <span>&#9881;&#65039;</span>
            <span>装備ファイルを選択</span>
        </div>
        <label class="same-file-toggle" title="1つ選ぶと3スロットすべて同じファイルになります">
            <input type="checkbox" id="same-file-check">
            <span>同一ファイル</span>
        </label>
    </div>
    <div class="file-list-header">
        <span>ファイル名</span>
        <span>種別</span>
        <span>ボーナス</span>
    </div>
    <div id="file-list" class="file-list"></div>
    <div class="bonus-panel">
        <div class="bonus-panel-header">拡張子ボーナス一覧</div>
        <div class="bonus-panel-list" id="bonus-list"></div>
    </div>
    <div class="exp-statusbar">
        <span id="status-text" class="status-text">ファイルをクリックして選択</span>
    </div>

    <!-- 初回だけ出る操作ガイド。C++から show=true が届いたときのみ表示される -->
    <div id="tutorial-tip" class="tutorial-tip" hidden>
        <div class="tutorial-step" id="tutorial-step">STEP 1 / 3</div>
        <div class="tutorial-title" id="tutorial-title"></div>
        <div class="tutorial-body" id="tutorial-body"></div>
        <div class="tutorial-actions">
            <button class="tutorial-skip" id="tutorial-skip">ガイドを閉じる</button>
            <button class="tutorial-next" id="tutorial-next" hidden>次へ →</button>
        </div>
    </div>
    <script src="common/messaging.js"></script>
    <script src="select/file/file-logic.js"></script>
    <script src="select/file/file-view.js"></script>
    <script src="select/file/file-tutorial.js"></script>
</body>
</html>
